<!DOCTYPE html>
<html>
<head>
  <style>
  /* 去掉iframe/embed默认边框 */
  iframe, embed {
    border: none;
    width: 100%;
    height: calc(100vh - 80px); /* 减去docsify顶部导航高度 */
    display: block;
  }
  /* 隐藏docsify页面内的padding，让PDF贴边 */
  .page {
    padding: 0 !important;
  }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的在线文档</title>
  <!-- Docsify 核心 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '我的文档',
      repo: 'Fhy711/paper',
      loadSidebar: true,  // 启用侧边栏
      subMaxLevel: 3,     // 目录层级
      search: 'auto'      // 搜索
    }
  </script>
</body>
</html>
